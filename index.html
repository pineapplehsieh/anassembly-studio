<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Architectural Work</title>
<meta name="description" content="A personal portfolio of architectural design work">
<style>
:root{
  --paper:   #fbfaf8;
  --ink:     #201f1d;
  --muted:   #8a8781;
  --line:    #eae7e1;
  --accent:  #6b6355;
  --f-heading: 'Trebuchet MS', 'Yu Gothic', 'Meiryo', sans-serif;
  --f-body:    'Yu Gothic Light', 'Yu Gothic', 'Meiryo', sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-weight:300;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; background:none; border:none; cursor:pointer; }
h1,h2,h3{ font-family:var(--f-heading); font-weight:700; letter-spacing:-0.01em; margin:0; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}
a:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

.wrap{ max-width:1100px; margin:0 auto; padding:0 28px; }

/* 只加寬「主畫面」(作品列表頁 #/work、#/category、#/year) 的容器寬度，
   案子內頁、系列頁、about、books 等其他頁面維持原本 1100px 寬度不變 */
@media (min-width:1300px){ .work-wrap{ max-width:1320px; padding:0 40px; } }
@media (min-width:1600px){ .work-wrap{ max-width:1560px; padding:0 48px; } }
@media (min-width:1920px){ .work-wrap{ max-width:1800px; padding:0 60px; } }

/* 頁首（Logo + 導覽列）與頁尾是每頁共用的元件，本身不屬於任何頁面內容，
   一併加寬讓它們在寬螢幕下更貼近首頁全滿版輪播圖的寬度，減少視覺落差 */
@media (min-width:1300px){ .site-header .wrap, .site-footer .wrap{ max-width:1320px; padding:0 40px; } }
@media (min-width:1600px){ .site-header .wrap, .site-footer .wrap{ max-width:1560px; padding:0 48px; } }
@media (min-width:1920px){ .site-header .wrap, .site-footer .wrap{ max-width:1800px; padding:0 60px; } }

/* ---------------- home hero — full-bleed rotating gallery ---------------- */
.home-hero{
  position:relative; width:100%; height:82vh; min-height:460px;
  overflow:hidden; background:#1c1b19; cursor:pointer;
}
.home-slides{ position:absolute; inset:0; }
.home-slide{ position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; }
.home-slide.active{ opacity:1; }
.home-slide img{ width:100%; height:100%; object-fit:cover; object-position: center; }
.placeholder-slide{
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#efece5,#ddd8cc);
  color:var(--muted); font-family:var(--f-heading); font-size:15px; letter-spacing:0.02em;
  text-align:center; padding:20px;
}

.home-caption-bl {
  position: absolute;
  left: 28px;
  right: 160px;
  bottom: 28px;
  z-index: 10;
  pointer-events: none;
}

.slide-caption {
  color: #fff;
  font-family: var(--f-heading);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.02em;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  text-align: left;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.home-arrow{
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.28);
  color: #fff;
  border-radius: 50%;
  font-size: 22px;
  line-height: 1;
  opacity: 0.75;
  transition: background 0.3s ease, opacity 0.3s ease;
}
.home-arrow:hover{ background: rgba(0,0,0,0.5); opacity: 1; }
.home-arrow-left{ left: 20px; }
.home-arrow-right{ right: 20px; }

.home-button-br {
  position: absolute;
  right: 28px;
  bottom: 28px;
  z-index: 10;
}

.home-view-all-btn {
  background: var(--paper);
  color: var(--ink);
  padding: 10px 22px;
  font-family: var(--f-heading);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.05em;
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
  display: inline-block;
}
.home-view-all-btn:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

@media (max-width:700px){
  .home-hero{ height:64vh; min-height:380px; }
  .home-caption-bl { left: 20px; right: 20px; bottom: 70px; }
  .home-button-br { right: 20px; bottom: 20px; }
  .slide-caption { font-size: 14px; }
  .home-view-all-btn { padding: 8px 16px; font-size: 12px; }
  .home-arrow{ width: 36px; height: 36px; font-size: 18px; }
  .home-arrow-left{ left: 10px; }
  .home-arrow-right{ right: 10px; }
}

/* ---------------- work list ---------------- */
.work-list{ border-top:1px solid var(--line); }
.work-row{
  display:flex; align-items:center; gap:26px;
  padding:24px 4px; border-bottom:1px solid var(--line);
  cursor:pointer; transition:background .2s ease;
}
.work-row:hover{ background:rgba(245,223,77,0.28); } /* Pantone 13-0647 TCX — Illuminating */
.work-year{ width:56px; flex-shrink:0; font-family:var(--f-heading); font-size:14px; color:var(--muted); }
.work-thumb{ width:200px; aspect-ratio:4/3; flex-shrink:0; overflow:hidden; border-radius:4px; background:#efece5; }
.work-thumb img{ width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
.work-row:hover .work-thumb img{ transform:scale(1.04); }
.work-title-wrap{ flex:1; min-width:0; }
.work-title{ font-size:21px; margin-bottom:4px; }
.work-meta{ color:var(--muted); font-size:13px; }
@media (min-width:1300px){ .work-thumb{ width:230px; } }
@media (min-width:1600px){ .work-thumb{ width:260px; } }
@media (max-width:600px){
  .work-row{ gap:16px; }
  .work-thumb{ width:130px; }
  .work-title{ font-size:17px; }
  .work-year{ width:40px; font-size:12.5px; }
}

/* header */
.site-header{ padding:36px 0 20px; }
.header-row{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:16px; }
.site-title{ font-size:22px; font-family:var(--f-heading); font-weight:700; }
.nav-links{ display:flex; gap:28px; font-size:14px; color:var(--muted); }
.nav-links a:hover{ color:var(--ink); }

/* category filter */
.filters{
  display:flex; gap:22px; flex-wrap:wrap;
  font-size:14px;
}
.filters button{ color:var(--muted); padding:2px 0; border-bottom:1px solid transparent; }
.filters button:hover{ color:var(--ink); }
.filters button.active{ color:var(--ink); border-color:var(--ink); }

/* work toolbar: category filters (left) + list/matrix view toggle (right) */
.work-toolbar{
  display:flex; justify-content:space-between; align-items:flex-end; gap:20px;
  flex-wrap:wrap;
  padding:18px 0 26px;
  border-bottom:1px solid var(--line);
}
.view-toggle{ display:flex; gap:4px; flex-shrink:0; }
.view-toggle button{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:4px;
  color:var(--muted); border:1px solid transparent;
}
.view-toggle button:hover{ color:var(--ink); }
.view-toggle button.active{ color:var(--ink); border-color:var(--line); background:rgba(0,0,0,0.03); }
.view-toggle svg{ width:16px; height:16px; display:block; }

/* matrix (array) view — all projects laid out in one flat, uniform grid,
   no category/year grouping, small tiles, hover reveals title + year */
.matrix-wrap{ width:100%; }
.matrix-table{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
  width:100%;
}
@media (max-width:900px){ .matrix-table{ grid-template-columns:repeat(4, 1fr); } }
@media (max-width:700px){ .matrix-table{ grid-template-columns:repeat(3, 1fr); gap:6px; } }
@media (max-width:460px){ .matrix-table{ grid-template-columns:repeat(2, 1fr); } }
.matrix-thumb{
  position:relative;
  aspect-ratio:4/3; border-radius:2px;
  overflow:hidden; cursor:pointer; background:#efece5;
}
.matrix-thumb img{ width:100%; height:100%; object-fit:cover; transition:transform .3s ease; }
.matrix-thumb:hover img{ transform:scale(1.08); }
.matrix-thumb .placeholder{ font-size:0; }
.matrix-thumb-caption{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(20,19,17,0.82) 0%, rgba(20,19,17,0.35) 45%, rgba(20,19,17,0) 75%);
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:8px 8px 6px;
  opacity:0; transition:opacity .2s ease;
  pointer-events:none;
}
.matrix-thumb:hover .matrix-thumb-caption, .matrix-thumb:focus-visible .matrix-thumb-caption{ opacity:1; }
.matrix-thumb-title{
  color:#fff; font-family:var(--f-heading); font-weight:700; font-size:14px; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,0.6);
}
.matrix-thumb-year{ color:rgba(255,255,255,0.9); font-size:12px; margin-top:3px; }
@media (max-width:700px){
  .matrix-thumb-title{ font-size:11.5px; }
  .matrix-thumb-year{ font-size:10px; }
}

/* intro */
.intro{ padding:44px 0 8px; max-width:560px; }
.intro h1{ font-size:34px; line-height:1.25; margin-bottom:14px; }
.intro p{ color:var(--muted); font-size:15.5px; }

/* grid */
.grid-section{ padding:44px 0 90px; }
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:52px 40px;
}
@media (max-width:700px){
  .grid{ grid-template-columns:1fr; gap:40px; }
  .card-title{ font-size:17px; }
  .card-meta{ font-size:12.5px; }
  .intro h1{ font-size:26px; }
  .intro p{ font-size:14px; }
}

.card{ cursor:pointer; }
.card-thumb{
  aspect-ratio:4/3; width:100%; overflow:hidden;
  border-radius:6px; margin-bottom:16px; background:#efece5;
}
.card-thumb img{ width:100%; height:100%; object-fit:cover; transition:transform .4s ease; }
.card:hover .card-thumb img{ transform:scale(1.03); }
.placeholder{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:13px; background:#efece5; text-align:center; padding:10px;
}
.card-title{ font-size:20px; margin-bottom:4px; }
.card-meta{ color:var(--muted); font-size:13.5px; }

.empty-state{ padding:60px 0; text-align:center; color:var(--muted); }

/* detail */
.detail{ padding-top:36px; padding-bottom:100px; }
.back-link{ display:inline-block; color:var(--muted); font-size:14px; margin-bottom:32px; }
.back-link:hover{ color:var(--ink); }

.detail-title{ font-size:clamp(30px,5vw,46px); line-height:1.15; margin-bottom:10px; white-space:pre-line; }
.detail-meta{ color:var(--muted); font-size:14.5px; margin-bottom:32px; }
.detail-meta > *:not(:last-child)::after{ content:"  ·  "; white-space: pre; }

.meta-link {
  color: var(--muted);
  border-bottom: 1px solid transparent;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.meta-link:hover {
  color: var(--ink);
  border-color: var(--ink);
}

.detail-hero{
  aspect-ratio:16/9; width:100%; overflow:hidden; border-radius:8px;
  background:#efece5; margin-bottom:44px;
}
.detail-hero img{ width:100%; height:100%; object-fit:cover; }

/* 系列頁主視覺：正方形、置中、比原本稍微放大，並用 contain 讓整張封面完整顯示、不被裁切 */
.series-hero{
  aspect-ratio:1/1; width:100%; max-width:640px; overflow:hidden; border-radius:8px;
  background:#efece5; margin:0 auto 44px;
  display:flex; align-items:center; justify-content:center;
}
.series-hero img{ width:100%; height:100%; object-fit:contain; }

/* 主視覺下方的文字介紹與收錄案子網格，統一置中並與主視覺同寬對齊 */
.series-content{ max-width:640px; margin:0 auto; }

/* 系列詳情頁的「被收錄案子」：固定 3 個一列的方塊網格 */
.series-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:28px 22px;
}
@media (max-width:820px){ .series-grid{ grid-template-columns:repeat(2, 1fr); gap:26px 20px; } }
@media (max-width:520px){ .series-grid{ grid-template-columns:1fr; gap:30px; } }

.detail-body{ display:grid; grid-template-columns:minmax(0,640px) 1fr; gap:80px; width:100%; }
@media (max-width:1000px){ .detail-body{ grid-template-columns:minmax(0,1fr) 1fr; gap:48px; } }
@media (max-width:800px){ .detail-body{ grid-template-columns:1fr; gap:28px; } }
.detail-desc p{ margin:0 0 18px; color:#3a3833; font-size:16.5px; line-height:1.85; max-width:640px; }
.side-info{ font-size:14px; color:var(--muted); line-height:1.9; }
@media (max-width:700px){
  .detail-title{ font-size:clamp(24px,7vw,32px); }
  .detail-meta{ font-size:13px; margin-bottom:24px; }
  .detail-desc p{ font-size:15px; line-height:1.75; }
  .side-info{ font-size:13px; }
}
.side-info strong{ display:block; color:var(--ink); font-size:13px; margin:22px 0 4px; }
.side-info strong:first-child{ margin-top:0; }

/* 側欄內的系列小縮圖（取代原本頁面下方的大區塊，改移到 Credits 旁邊） */
.side-series{ margin-top:10px; cursor:pointer; display:inline-block; }
.side-series-thumb{
  width:140px; height:140px; overflow:hidden; background:#efece5;
  box-shadow:0 6px 18px rgba(32,31,29,0.18);
  transition:opacity .25s ease, transform .25s ease, box-shadow .25s ease;
}
.side-series:hover .side-series-thumb{ opacity:0.85; transform:translateY(-2px); box-shadow:0 10px 22px rgba(32,31,29,0.24); }
.side-series-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.side-series-placeholder{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  text-align:center; font-size:9px; color:var(--muted); padding:4px; box-sizing:border-box;
}

.project-gallery{ margin-top:56px; }
.project-gallery h3{ font-size:18px; margin-bottom:20px; color:var(--muted); font-weight:400; }
.project-drawings{ margin-top:56px; }
.project-drawings h3{ font-size:18px; margin-bottom:20px; color:var(--muted); font-weight:400; }

/* ---------------- series — 系列縮圖＋譜系彈窗 ----------------
   Gallery 和 More work 之間只放「這個系列」單一一張正方形縮圖（圖片由你自己製作、放到 images/ 底下，
   在 PROJECTS 資料的 series.thumb 填入路徑即可）。縮圖尺寸跟 Books 頁面的書封同一套欄寬邏輯
   （沿用 .book-grid 的 grid-template-columns），只是比例改成正方形。
   點擊縮圖會跳出一個彈窗，列出這個系列所有頁面，目前所在的頁面那一項會提高透明度、不可點擊。 */
.series-thumb-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:44px 34px;
}
@media (max-width:820px){ .series-thumb-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .series-thumb-grid{ grid-template-columns:repeat(2,1fr); gap:30px 20px; } }
.series-thumb-trigger{
  aspect-ratio:1/1; width:100%;
  overflow:hidden; cursor:pointer;
  background:#efece5;
  box-shadow:0 6px 20px rgba(32,31,29,0.16);
  transition:opacity .25s ease, transform .25s ease, box-shadow .25s ease;
}
.series-thumb-trigger:hover{ opacity:0.85; transform:translateY(-3px); box-shadow:0 12px 26px rgba(32,31,29,0.22); }
.series-thumb-trigger img{ width:100%; height:100%; object-fit:cover; display:block; }
.series-thumb-placeholder{
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:4px; border:1px dashed var(--line); box-sizing:border-box;
  font-family:var(--f-heading); font-size:13px; color:var(--muted); padding:14px;
}
.series-thumb-placeholder span{ font-size:11px; opacity:0.7; word-break:break-all; }
.series-caption{ margin-top:14px; font-size:14px; color:var(--muted); }
.series-caption b{ color:var(--ink); font-weight:600; }
.series-index-card{ cursor:pointer; }

/* 系列完整介紹頁（取代原本的彈窗，改成獨立頁面 #/series/:id，樣式沿用同一套 list/item） */
.series-pedigree-sub{ font-size:14px; color:var(--muted); margin-top:6px; margin-bottom:30px; }
.series-pedigree-list{ display:flex; flex-direction:column; }
.series-pedigree-item{
  display:flex; align-items:center; gap:24px;
  padding:22px 0; border-top:1px solid var(--line);
  cursor:pointer; transition:opacity .25s ease;
}
.series-pedigree-list .series-pedigree-item:first-child{ border-top:none; }
.series-pedigree-item:not(.current):hover .series-pedigree-title{ color:var(--accent); }
.series-pedigree-thumb{ width:104px; height:104px; flex:0 0 auto; overflow:hidden; background:#efece5; }
.series-pedigree-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.series-pedigree-part{ font-family:var(--f-heading); font-size:12.5px; color:var(--muted); letter-spacing:0.05em; margin-bottom:5px; }
.series-pedigree-title{ font-size:18px; line-height:1.35; color:var(--ink); transition:color .2s ease; }
.series-pedigree-item.current{
  cursor:default;
  opacity:0.45; /* 目前所在頁面：提高透明度 */
}

@media (max-width:700px){
  .series-pedigree-panel{ padding:34px 22px 24px; }
  .series-pedigree-thumb{ width:76px; height:76px; }
  .series-pedigree-head h3{ font-size:22px; }
  .series-pedigree-title{ font-size:15.5px; }
}

/* gallery — Pinterest 式多欄瀑布流：每張圖片依自己的比例往下堆疊，
   不用固定格數的網格去「跨欄跨列」，所以不會留下空白區塊。
   手機版維持至少 2 欄，不會變成單欄「一張一張」條列。 */
.gallery-grid{
  column-count: 3;
  column-gap: 12px;
}
.gallery-item{
  display:block; width:100%;
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
  margin-bottom: 12px;
  overflow:hidden; border-radius:4px; background:#fff;
  cursor:zoom-in; position:relative;
}
.gallery-item img{
  width:100%; height:auto; display:block;
  transition:transform .4s ease;
}
.gallery-item:hover img{ transform:scale(1.045); }
.gallery-item.large img{ aspect-ratio: 3 / 4; object-fit:cover; }
.gallery-item.small img{ aspect-ratio: 4 / 3; object-fit:cover; }
/* wide：給橫式照片使用。維持跟 large/small 一樣的單欄寬度，只是比例較扁（3:2），
   不使用 column-span 跨欄，才能真正無縫融入瀑布流（跨欄會強制斷版造成空白，
   Pinterest 本身也是靠「同欄寬、高度不同」達到無縫排列，並沒有跨欄的圖） */
.gallery-item.wide img{ aspect-ratio: 3 / 2; object-fit:cover; }

@media (max-width: 750px) {
  .gallery-grid{ column-count: 2; }
}
@media (max-width: 420px) {
  .gallery-grid{ column-gap: 8px; }
  .gallery-item{ margin-bottom: 8px; }
}

/* JS 強制多欄瀑布流：CSS 的 column-count 在手機 Safari 上做「欄高平衡」時，
   常常算不準，導致第二欄的第一張圖片沒辦法跟第一欄切齊頂端、上方留一截空白。
   等版面渲染完成後，JS 會依照圖片實際比例把項目分配進真正獨立的欄位 div
   （.masonry-col），改用 flex 排版；因為每一欄都是各自獨立堆疊，
   欄位裡的第一個項目必定貼齊最上方，兩欄自然對齊。 */
.gallery-grid.js-columns{
  display:flex;
  align-items:flex-start;
  column-count:initial;
  column-gap:initial;
  gap:12px;
}
.gallery-grid.js-columns .masonry-col{
  display:flex;
  flex-direction:column;
  flex:1 1 0;
  min-width:0;
  gap:12px;
}
.gallery-grid.js-columns .gallery-item{
  margin-bottom:0;
  break-inside:auto;
}
@media (max-width: 420px) {
  .gallery-grid.js-columns{ gap:8px; }
  .gallery-grid.js-columns .masonry-col{ gap:8px; }
}

/* drawings — 桌機維持原本的網格排版（large 佔滿整列、small 一列2張、tiny 一列3張）。
   手機版另外改用跟 gallery 一樣的 Pinterest 多欄瀑布流，避免手機上變成整張圖佔一列、
   一張一張往下排的條列式版面。 */
.drawing-grid{
  display:grid;
  grid-template-columns: repeat(6, 1fr);
  gap:12px;
}
.drawing-item{
  display:block; width:100%;
  overflow:hidden; border-radius:4px; background:#fff;
  cursor:zoom-in; position:relative;
}
.drawing-item.large{ grid-column: span 6; }
.drawing-item.small{ grid-column: span 3; }
.drawing-item.tiny{ grid-column: span 2; }
.drawing-item.large.portrait{ grid-column: span 3; }
.drawing-item.small.portrait{ grid-column: span 2; }
.drawing-item img{
  width:100%; height:100%; display:block;
  transition:transform .4s ease;
}
.drawing-item:hover img{ transform:scale(1.045); }
.drawing-item.large img{ aspect-ratio: 3 / 2; object-fit:cover; }
.drawing-item.small img{ aspect-ratio: 16 / 9; object-fit:cover; }
.drawing-item.tiny img{ aspect-ratio: 2 / 1; object-fit:cover; }
.drawing-item.large.portrait img{ aspect-ratio: 2 / 3; object-fit:cover; }
.drawing-item.small.portrait img{ aspect-ratio: 3 / 4; object-fit:cover; }

@media (max-width: 750px) {
  .drawing-grid{
    display:block;
    column-count: 2;
    column-gap: 12px;
  }
  .drawing-item{
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin-bottom: 12px;
  }
  .drawing-item img{ height:auto; }
}
@media (max-width: 420px) {
  .drawing-grid{ column-gap: 8px; }
  .drawing-item{ margin-bottom: 8px; }
}

/* 同 .gallery-grid：手機版改用 JS 分配的真正欄位 div，避免 column-count
   在 Safari 上把第二欄的第一張圖往下擠，跟第一欄頂端對不齊。 */
.drawing-grid.js-columns{
  display:flex;
  align-items:flex-start;
  column-count:initial;
  column-gap:initial;
  gap:12px;
}
.drawing-grid.js-columns .masonry-col{
  display:flex;
  flex-direction:column;
  flex:1 1 0;
  min-width:0;
  gap:12px;
}
.drawing-grid.js-columns .drawing-item{
  margin-bottom:0;
  break-inside:auto;
}
@media (max-width: 420px) {
  .drawing-grid.js-columns{ gap:8px; }
  .drawing-grid.js-columns .masonry-col{ gap:8px; }
}


/* lightbox */
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(20,19,17,0.94);
  display:none; align-items:center; justify-content:center;
  z-index:1000; padding:48px; cursor:zoom-out;
  overflow:hidden;
}
.lightbox-overlay.active{ display:flex; }
.lightbox-overlay img{
  max-width:100%; max-height:100%; width:auto; height:auto;
  object-fit:contain; border-radius:4px; box-shadow:0 10px 40px rgba(0,0,0,0.45);
  cursor:zoom-in;
  transform-origin:center center;
  transition:transform .18s ease;
  touch-action:none;
  user-select:none;
}
.lightbox-overlay img.zoomed{ cursor:grab; }
.lightbox-overlay img.zoomed.lb-dragging{ cursor:grabbing; transition:none; }
.lightbox-zoom-hint{
  position:absolute; top:24px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.55); font-size:12px; letter-spacing:0.02em;
  pointer-events:none; transition:opacity .2s ease;
}
@media (max-width:700px){ .lightbox-zoom-hint{ display:none; } }
.lightbox-close{
  position:absolute; top:24px; right:28px; color:#fff; font-size:32px;
  line-height:1; background:none; border:none; cursor:pointer; opacity:0.85;
}
.lightbox-close:hover{ opacity:1; }
.lightbox-nav{
  position:absolute; top:50%; transform:translateY(-50%); color:#fff;
  font-size:26px; background:rgba(255,255,255,0.1); border:none;
  width:48px; height:48px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s ease;
}
.lightbox-nav:hover{ background:rgba(255,255,255,0.2); }
.lightbox-prev{ left:20px; }
.lightbox-next{ right:20px; }
.lightbox-counter{
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,0.75); font-size:13px; letter-spacing:0.04em;
}
.lightbox-pdf-viewer{
  display:none; align-items:center; justify-content:center;
  position:relative;
  width:min(92vw, 1200px); height:86vh;
}
.pdf-scroller{
  display:flex;
  width:100%; height:100%;
  overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  cursor:grab;
}
.pdf-scroller::-webkit-scrollbar{ display:none; }
.pdf-scroller.dragging{ cursor:grabbing; scroll-snap-type:none; }
.pdf-page{
  flex:0 0 100%;
  scroll-snap-align:center;
  display:flex; align-items:center; justify-content:center;
  height:100%;
  user-select:none;
}
.pdf-page canvas{
  display:block; background:#fff; border-radius:2px;
  box-shadow:0 10px 40px rgba(0,0,0,0.45);
  max-width:100%; max-height:100%;
  opacity:1; transition:opacity .25s ease;
  pointer-events:none;
}
.pdf-page.pending canvas{ opacity:0; }
.lightbox-pdf-loading{
  display:none; position:absolute; color:rgba(255,255,255,0.85);
  font-size:13px; letter-spacing:0.04em; font-family:var(--f-heading);
  pointer-events:none;
}
.lightbox-pdf-viewer.loading .lightbox-pdf-loading{ display:block; }
.lightbox-pdf-error{
  display:none; color:rgba(255,255,255,0.85); font-size:14px;
  text-align:center; max-width:320px; line-height:1.7;
}
.lightbox-pdf-error a{ color:#fff; border-bottom:1px solid rgba(255,255,255,0.5); }

.lightbox-pdf-slider{
  position:absolute; bottom:50px; left:50%; transform:translateX(-50%);
  width:min(60vw, 420px); z-index:12;
  display:flex; align-items:center; gap:10px;
}
.lightbox-pdf-slider input[type="range"]{
  -webkit-appearance:none; appearance:none;
  flex:1; height:3px; margin:0;
  background:rgba(255,255,255,0.25);
  border-radius:2px; outline:none; cursor:pointer;
}
.lightbox-pdf-slider input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:13px; height:13px; border-radius:50%;
  background:#fff; cursor:pointer;
  box-shadow:0 1px 5px rgba(0,0,0,0.45);
  transition:transform .15s ease;
}
.lightbox-pdf-slider input[type="range"]:hover::-webkit-slider-thumb,
.lightbox-pdf-slider input[type="range"]:active::-webkit-slider-thumb{ transform:scale(1.2); }
.lightbox-pdf-slider input[type="range"]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%;
  background:#fff; border:none; cursor:pointer;
  box-shadow:0 1px 5px rgba(0,0,0,0.45);
}
.lightbox-pdf-slider input[type="range"]::-moz-range-track{
  height:3px; background:rgba(255,255,255,0.25); border-radius:2px;
}
@media (max-width:600px){
  .lightbox-pdf-slider{ bottom:44px; width:min(78vw, 320px); }
}
@media (max-width:600px){

    description: `第一次將專案計畫向大家開放，以工作坊的形式來尋找符合當今建築系學生所迫切需要的機能支持：<br>位於設計教室之間、寬約三米的夾擠空間，隨時間推移與教學體制變遷，其使用方式亦不斷轉換：從最初規劃的模型室，逐漸成為儲藏室與系雅圖，直至今日，面向主要走廊的兩面牆體被拆除，隱於後方的樓梯間完全敞開，形成新的公共剖面，串聯一樓至二樓、連接大一至大三，成為同時支撐課間活動與教學成果交流的共享場所。<br>與教學體制同步變化的，也體現在系館家具之上。現今僅存於大一設計教室的圖桌，實為建築系遷入現址後購置的第一批家具，曾長期服務於各年級使用，隨後逐步被紙材工作桌、角鋼工作桌等取代。在教學空間型態產生巨大轉變的同時，這些長期堆置的圖桌架，或許也能重新被視為新的物件，並在考量現況需求後賦予其新的功能與意義。 最終，空間與物件皆在不斷被重新理解與再利用的過程中，持續回應教學與使用者的需求，也讓既有環境在轉變中生成新的公共可能。<br>本工作坊的實作課程為「空間家具製作」。空間家具單元則以現成物與既有框架為基礎，透過組裝與配置，製作可移動、具多元用途的家具系統，回應不同使用情境。藉由實作活動進行，從施工到組裝，探索空間如何在操作中被重新定義。<br><br>In this workshop, we opened the project to students, creating a space that meets the urgent needs of architecture students today. The narrow space between the design studios, approximately three meters wide, has evolved over time with changes in the educational system. Initially planned as a model room, it gradually became a storage area and a gallery for student work. Today, with the removal of walls facing the main corridor and the opening of the staircase area, it has become a new public section connecting the first and second floors and linking first-year to third-year students, supporting both class activities and the exchange of teaching outcomes.<br>The evolution of the educational system is also reflected in the department's furniture. The remaining drawing tables in the first-year design studio were part of the first batch of furniture purchased when the architecture department moved to its current location. They served all year levels for a long time before being replaced by paper work tables and angle steel work tables. As teaching spaces have undergone significant changes, these long-stored drawing table frames can be reconsidered as new objects, given new functions and meanings based on current needs. Ultimately, both space and objects continue to respond to teaching and user needs through ongoing reinterpretation and reuse, allowing existing environments to generate new public possibilities through transformation.<br>The practical course of this workshop is "Space Furniture Making." The space furniture unit is based on ready-made objects and existing frameworks, assembled and configured to create movable furniture systems with multiple uses, responding to different usage scenarios. Through hands-on activities from construction to assembly, we explore how space can be redefined through operation.`,

    description: `一切開始於對正常集合住宅的拒絕，但出自於回應基地紋理。竹溪原先彎曲地穿越城鎮，後來被截斷並向南導出一條新的人工水線。水文被暴力地更動，不規則的街廓卻提醒其存在。曾經依河而生的聚落，今與理想秩序的棋盤街道相接，一端是工業化系統，一端是歷史的地形記憶，兩種紋理交錯產生不穩定的場域。在設計案中：一條人工水道以泳池為機能被放置在原河線周遭，離地四米，長二十六米，不試圖修復，而是選擇過度再造，對截彎取直的回應。腔室以不規則街區為原型，從數百單元，壓縮至1至2戶。它們成為建築的單位，不再是集合。棋盤街道不再存在外部而嵌入其中並串連腔室，抬升九十公分，使用被切割，活動被嵌入，好似反原本既定廊道的凸字型。所有邊界變得模糊，所有系統成為碎片，所有碎片重新生成系統。<br><br>It begins with a rejection of the conventional collective housing model, yet still responds to the site’s texture. The river once meandered through the town before being cut and redirected south into an artificial channel. Though the hydrology was forcibly altered, the irregular urban fabric continues to reveal its memory. A settlement once shaped by the river now meets the imposed order of a grid—industrial logic on one side, historical terrain on the other—producing an unstable field where two systems overlap.<br>In this project, an artificial water line reappears as a pool, placed along the former river path—elevated four meters and extending twenty-six meters. Rather than restoring, it chooses to reinterpret, responding to the act of straightening the river. Spatial chambers, derived from irregular blocks, are compressed into one- to two-unit entities, becoming the building’s fundamental units rather than a collective whole. The grid is no longer external but embedded within, linking these chambers while lifted 90 cm, fragmenting use and inserting activity—reversing the conventional corridor logic. Boundaries blur, systems fragment, and fragments recombine into a new order.`,

    summary: "A performance space with a folded roof that reconfigures for different shows.",
    description: `龐畢度中心最大的特色，在於將原本隱藏於建築內部的結構、設備管線與交通系統移至建築外側，讓立面不只是建築的外殼，更成為建築運作方式的展現。不同顏色的管線分別代表不同的設備系統，使人們能直接從外觀理解建築的組成，也讓立面呈現出鮮明且富有秩序的特色。這樣的設計不僅提高了室內空間的使用彈性，也改變了人們對建築外觀的既有印象。<br>本次研究透過分析龐畢度中心立面的構成方式，將結構、管線、交通系統與立面框架重新整理，並以模型重現各元素之間的配置關係。在製作過程中發現，這些外露的構件並非只是視覺上的裝飾，而是共同支撐建築運作的重要部分。透過模型的重構，更能理解龐畢度中心如何運用規律的構架、鮮明的色彩與清楚的系統配置，打造出兼具功能性與辨識度的立面，也展現出高科技建築將工程技術直接轉化為建築表現的設計特色。<br><br>The most distinctive feature of the Centre Pompidou is its externalization of structural, mechanical, and circulation systems, transforming the facade into a visible expression of the building’s operational logic. Color-coded pipes represent different systems, allowing observers to understand the building’s composition at a glance, while imparting a striking and orderly aesthetic. This design not only enhances interior spatial flexibility but also challenges conventional perceptions of architectural exteriors.<br>This study analyzes the facade’s composition, reorganizing its structural, mechanical, and circulation elements and reconstructing their relationships through modeling. The process revealed that these exposed components are not mere visual embellishments but integral to the building’s functionality. By reconstructing the model, we gain insight into how the Centre Pompidou employs systematic frameworks, vivid colors, and clear configurations to create a facade that is both functional and iconic, exemplifying high-tech architecture’s translation of engineering into architectural expression.`,

    description: `作為「制度化逃離」的劇場功能，從更廣闊的視角來看，劇場仍是一種基礎設施，支撐著廣場那份真切的熱烈氛圍。這座碗狀、類似體育場的建築形式，已透過地面與牆壁實現了空間的圍合與支撐，而劇場那懸浮的體量，則構成了天空的空間邊界。<br>我們設想的天花板既具功能性，又能促進廣場層進行更多元的活動。<br>劇場中常見的走道設施，通常是最隱蔽的空間區域；當它們向外延伸至建築外皮時，劇場體量便顯得殘缺且支離破碎，反而更像一個向外擴張的基礎設施核心。<br>走道外殼在劇院體量周圍被解構，轉化為由鋼纜構成的立面。外殼與建築外牆之間預留了一條供工作人員使用的維護通道，而標準的走道設施則設置於體量基部。<br><br>As a theatrical function of “institutionalized escape,” the theater, viewed from a broader perspective, still serves as a form of infrastructure that supports the square’s state of genuine excitement. The bowl-shaped, stadium-like architectural form has already achieved the spatial enclosure and support provided by the ground and walls, while the floating volume of the theater serves as the spatial boundary of the sky.<br>We envision a ceiling that is both functional and capable of fostering a wider variety of activities on the plaza level.<br>The catwalk facilities commonly found in theaters are typically the most concealed spatial areas; when they are turned outward onto the building’s skin, the theater volume becomes incomplete and disjointed, resembling instead an outward-expanding infrastructure core.<br>The catwalk envelope is deconstructed around the theater volume into a facade composed of steel cables. A maintenance passage is left between the envelope and the building’s exterior wall for staff use, while the standard catwalk facilities are situated at the base of the volume.`,

const app = document.getElementById("app");

function categories(){
  const list = [];
  PROJECTS.forEach(p => { if(!list.includes(p.category)) list.push(p.category); });
  return list;
}

function esc(str){
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[s]));
}

function thumb(p){
  if(p.cover){
    return `<div class="card-thumb"><img decoding="async" src="${esc(p.cover)}" alt="${esc(p.title)}" loading="lazy" style="object-position:${esc(p.coverPosition || "center")}"></div>`;
  }
  return `<div class="card-thumb"><div class="placeholder">Image coming soon</div></div>`;
}

function bookCover(b){
  if(b.cover){
    const clickable = b.file ? " book-cover-clickable" : "";
    const attrs = b.file ? ` data-pdf-src="${esc(b.file)}" data-book-title="${esc(b.title)}"` : "";
    return `<div class="book-cover${clickable}"${attrs}><img decoding="async" src="${esc(b.cover)}" alt="${esc(b.title)} cover" loading="lazy"></div>`;
  }
  return `<div class="book-cover"><div class="placeholder">Cover coming soon</div></div>`;
}

function bookCardHtml(b){
  return `
    <div class="book-card">
      ${bookCover(b)}
      <h3 class="book-title">${esc(b.title)}</h3>
      <p class="book-meta">${esc(b.year)}</p>
    </div>
  `;
}

function booksForProject(project){
  const ids = project.books || [];
  return BOOKS.filter(b => ids.includes(b.id));
}

/* 系列（series）：一個專案現在可以同時收錄在「複數個」系列中，
   所以 project.series 是一個陣列，例如：
   series: [ { id:"Series-R", part:1 }, { id:"Series-S", part:2 } ]
   下面這些函式都是以「某一個 series id」為主角去找相關資料，
   而不是像以前一樣以單一 project 為主角。 */

/* 找出某個 project 在某個 series 裡對應的 { id, part } 項目 */
function seriesEntry(project, seriesId){
  return (project.series || []).find(s => s.id === seriesId);
}

/* 找出屬於某個 series id 的所有專案，並依各自的 part 由小到大排序 */
function seriesMembers(seriesId){
  return PROJECTS
    .filter(x => (x.series || []).some(s => s.id === seriesId))
    .sort((a, b) => (seriesEntry(a, seriesId).part || 0) - (seriesEntry(b, seriesId).part || 0));
}

/* 系列總覽：收集所有出現過的 series id，each 一筆（供頂部 Series 分類頁使用），
   標題／縮圖／介紹文字統一從 SERIES_INFO 讀取，找不到時才 fallback 到自動產生的預設值 */
function allSeries(){
  const ids = [];
  PROJECTS.forEach(p => {
    (p.series || []).forEach(s => {
      if(!ids.includes(s.id)) ids.push(s.id);
    });
  });
  return ids.map(id => {
    const info = SERIES_INFO[id] || {};
    return {
      id,
      title: info.title || id,
      cover: info.cover || info.thumb || "",
      thumb: info.thumb || info.cover || "",
      description: info.description || "",
      members: seriesMembers(id)
    };
  });
}

let currentCategory = "All";
let currentViewMode = "list"; // "list" | "matrix" — matrix 模式為所有案子一字排開的縮圖陣列
let currentYearFilter = null; 
let homeSlideTimer = null;
let homeSlideIdx = 0;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function collectHomeSlides(){
  const slides = [];
  PROJECTS.forEach(p => {
    if(p.cover) slides.push({ type:"image", src:p.cover, alt:p.title, id: p.id, position: p.coverPosition || "center" });
  });
  if(!slides.length){
    PROJECTS.slice(0, 8).forEach(p => slides.push({ type:"placeholder", label:p.title, id: p.id }));
  }
  return shuffleArray(slides);
}

function stopHomeSlideshow(){
  if(homeSlideTimer){ clearInterval(homeSlideTimer); homeSlideTimer = null; }
}

function goToHomeSlide(newIdx){
  const slides = document.querySelectorAll("#homeHero .home-slide");
  const captionEl = document.getElementById("slideCaption");
  if(!slides.length) return;
  if(slides[homeSlideIdx]) slides[homeSlideIdx].classList.remove("active");
  homeSlideIdx = ((newIdx % slides.length) + slides.length) % slides.length;
  slides[homeSlideIdx].classList.add("active");
  if(captionEl && slides[homeSlideIdx].dataset.title){
    captionEl.textContent = slides[homeSlideIdx].dataset.title;
  }
}

function startHomeSlideshow(){
  stopHomeSlideshow();
  const slides = document.querySelectorAll("#homeHero .home-slide");
  if(slides.length <= 1) return;
  homeSlideTimer = setInterval(() => {
    goToHomeSlide(homeSlideIdx + 1);
  }, 4000);
}

function navHomeSlide(direction){
  goToHomeSlide(homeSlideIdx + direction);
  startHomeSlideshow();
}

function galleryItemSrc(item){

function gallerySizeClass(item){

}
function galleryItemPosition(item){

function galleryItemFit(item){

/* ---------------- JS 瀑布流欄位對齊 ----------------
   CSS 的 column-count 排版（Pinterest 式瀑布流）在手機 Safari 上有個已知問題：
   瀏覽器會嘗試「平衡」各欄的總高度，但計算常常不準，導致第二欄的第一張圖片
   沒辦法跟第一欄的第一張圖片切齊頂端，上方多出一截空白。
   解法：改用 JS 把項目依序分配進真正獨立的欄位 <div>（每欄用 flex-direction:column
   各自往下堆疊），這樣每一欄的第一個項目必定貼齊最上方，兩欄自然對齊。
   分配時用「目前最矮的那一欄」演算法，依照 large/small/wide/tiny 各自的
   長寬比粗估高度，讓兩欄整體高度盡量平均。 */
function estimateItemHeightRatio(item){
  if(item.classList.contains("large")) return 4 / 3; // 直式照片，較高
  if(item.classList.contains("wide")) return 2 / 3;  // 橫式照片，較扁
  if(item.classList.contains("tiny")) return 1;
  return 3 / 4; // small（預設），中等高度
}

function applyMasonryColumns(grid, itemSelector, columnCount, indexAttr){
  if(!grid) return;
  const items = Array.from(grid.querySelectorAll(itemSelector))
    .sort((a, b) => Number(a.dataset[indexAttr] || 0) - Number(b.dataset[indexAttr] || 0));
  if(!items.length) return;

  if(!columnCount || columnCount <= 1){
    grid.classList.remove("js-columns");
    items.forEach(it => grid.appendChild(it));
    grid.querySelectorAll(":scope > .masonry-col").forEach(col => col.remove());
    return;
  }

  grid.classList.add("js-columns");
  const cols = [];
  for(let i = 0; i < columnCount; i++){
    const col = document.createElement("div");
    col.className = "masonry-col";
    cols.push(col);
  }
  const colHeights = new Array(columnCount).fill(0);
  items.forEach(item => {
    let shortest = 0;
    for(let i = 1; i < columnCount; i++){
      if(colHeights[i] < colHeights[shortest]) shortest = i;
    }
    cols[shortest].appendChild(item);
    colHeights[shortest] += estimateItemHeightRatio(item);
  });
  grid.innerHTML = "";
  cols.forEach(col => grid.appendChild(col));
}

function refreshMasonry(){
  const w = window.innerWidth;
  const galleryCols = w <= 750 ? 2 : 3;
  document.querySelectorAll(".gallery-grid").forEach(g => {
    applyMasonryColumns(g, ".gallery-item", galleryCols, "galleryIndex");
  });
  // drawing-grid 桌機版用固定的 CSS grid（span 排版），不套用 JS 瀑布流，
  // 只有手機版（原本會切換成 column-count 瀑布流的寬度）才需要 JS 接手。
  const drawingCols = w <= 750 ? 2 : 0;
  document.querySelectorAll(".drawing-grid").forEach(g => {
    applyMasonryColumns(g, ".drawing-item", drawingCols, "drawingIndex");
  });
}

function debounce(fn, wait){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), wait);
  };
}

window.addEventListener("resize", debounce(refreshMasonry, 150));

/* ============================================================
   LIGHTBOX LOGIC
   ============================================================ */
let lightboxImages = [];
let lightboxIndex = 0;
let lbZoomed = false;
let lbScale = 1;
let lbPanX = 0, lbPanY = 0;
let lbDragging = false;
let lbDragStartX = 0, lbDragStartY = 0, lbPanStartX = 0, lbPanStartY = 0;

const lightboxEl = document.getElementById("lightbox");
const lightboxImgEl = document.getElementById("lightboxImg");
const lightboxZoomHintEl = document.getElementById("lightboxZoomHint");
const lightboxPdfViewerEl = document.getElementById("lightboxPdfViewer");
const pdfScrollerEl = document.getElementById("pdfScroller");
const lightboxPdfErrorEl = document.getElementById("lightboxPdfError");
const lightboxPdfErrorLinkEl = document.getElementById("lightboxPdfErrorLink");
const lightboxCounterEl = document.getElementById("lightboxCounter");
const lightboxPrevBtn = document.getElementById("lightboxPrev");
const lightboxNextBtn = document.getElementById("lightboxNext");
const lightboxPdfSliderEl = document.getElementById("lightboxPdfSlider");
const pdfPageRangeEl = document.getElementById("pdfPageRange");
let isDraggingPdfSlider = false;

/* PDF 書頁狀態：每一頁都是一張獨立的 canvas，並排放在一條可橫向滑動、
   有 scroll-snap 的軌道上 — 像連續滑動相片一樣翻頁，不跳新分頁，
   也不使用瀏覽器原生的 PDF 檢視器。 */
let pdfDoc = null;
let pdfPageCount = 0;
let pdfCurrentPage = 1;
let pdfLoadId = 0;
let pdfObserver = null;

function openLightbox(images, index){
  lightboxImages = images;
  lightboxIndex = index;
  updateLightbox();
  lightboxEl.classList.add("active");
  lightboxEl.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function resetLbZoom(){
  lbZoomed = false; lbScale = 1; lbPanX = 0; lbPanY = 0;
  lightboxImgEl.classList.remove("zoomed", "lb-dragging");
  lightboxImgEl.style.transform = "";
  lightboxZoomHintEl.style.opacity = "";
}

function closeLightbox(){
  lightboxEl.classList.remove("active");
  lightboxEl.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  resetPdfViewer();
  resetLbZoom();
}

function resetPdfViewer(){
  pdfDoc = null;
  pdfLoadId++;
  if(pdfObserver){ pdfObserver.disconnect(); pdfObserver = null; }
  pdfScrollerEl.innerHTML = "";
  isDraggingPdfSlider = false;
  lightboxPdfSliderEl.style.display = "none";
}

function updateLightbox(){
  const item = lightboxImages[lightboxIndex];
  const isPdf = item.type === "pdf";

  lightboxImgEl.style.display = isPdf ? "none" : "block";
  lightboxPdfViewerEl.style.display = isPdf ? "flex" : "none";
  lightboxPdfErrorEl.style.display = "none";
  lightboxZoomHintEl.style.display = isPdf ? "none" : "block";
  resetLbZoom();

  if(isPdf){
    lightboxImgEl.src = "";
    loadPdfDocument(item.src);
  } else {
    resetPdfViewer();
    lightboxImgEl.src = item.src;
    lightboxImgEl.alt = item.alt || "";
    updateLightboxNav();
  }
}

/* 依目前是在看圖片組還是 PDF 書頁，決定計數器與上一頁/下一頁按鈕的顯示方式 */
function updateLightboxNav(){
  const item = lightboxImages[lightboxIndex];
  const isPdf = item.type === "pdf";

  if(isPdf){
    const multiPage = pdfPageCount > 1;
    lightboxPrevBtn.style.display = multiPage ? "flex" : "none";
    lightboxNextBtn.style.display = multiPage ? "flex" : "none";
    lightboxCounterEl.textContent = pdfPageCount ? `${pdfCurrentPage} / ${pdfPageCount}` : "";

    lightboxPdfSliderEl.style.display = multiPage ? "flex" : "none";
    if(multiPage){
      pdfPageRangeEl.min = "1";
      pdfPageRangeEl.max = String(pdfPageCount);
      if(!isDraggingPdfSlider) pdfPageRangeEl.value = String(pdfCurrentPage);
    }
  } else {
    const multi = lightboxImages.length > 1;
    lightboxPrevBtn.style.display = multi ? "flex" : "none";
    lightboxNextBtn.style.display = multi ? "flex" : "none";
    lightboxCounterEl.textContent = multi ? `${lightboxIndex + 1} / ${lightboxImages.length}` : "";
    lightboxPdfSliderEl.style.display = "none";
  }
}

async function loadPdfDocument(src){
  const loadId = ++pdfLoadId;
  pdfDoc = null;
  pdfPageCount = 0;
  pdfCurrentPage = 1;
  if(pdfObserver){ pdfObserver.disconnect(); pdfObserver = null; }
  pdfScrollerEl.innerHTML = "";
  pdfScrollerEl.scrollLeft = 0;
  lightboxPdfViewerEl.classList.add("loading");
  updateLightboxNav();

  if(!window.pdfjsLib){
    lightboxPdfViewerEl.classList.remove("loading");
    showPdfError(src, "PDF 元件載入失敗（pdf.js 未載入，請確認網路連線）");
    return;
  }
  try{
    // encodeURI 避免路徑中的中文檔名或空白造成讀取失敗
    const doc = await pdfjsLib.getDocument(encodeURI(src)).promise;
    if(loadId !== pdfLoadId) return; // 使用者已切換到別的項目
    pdfDoc = doc;
    pdfPageCount = doc.numPages;
    buildPdfPages(loadId);
    lightboxPdfViewerEl.classList.remove("loading");
    updateLightboxNav();
  }catch(err){
    if(loadId !== pdfLoadId) return;
    console.warn("PDF 載入失敗：", src, err);
    lightboxPdfViewerEl.classList.remove("loading");
    showPdfError(src, (err && err.message) ? err.message : String(err));
  }
}

function showPdfError(src, reason){
  lightboxPdfErrorEl.style.display = "block";
  lightboxPdfErrorLinkEl.href = src;
  const reasonEl = document.getElementById("lightboxPdfErrorReason");
  if(reasonEl) reasonEl.textContent = reason || "";
}

/* 建立每一頁的容器並排放進捲動軌道；用 IntersectionObserver 偵測哪一頁
   正進入畫面，即時渲染該頁（並順便預先渲染相鄰頁面），滑動起來才會順暢。 */
function buildPdfPages(loadId){
  const frag = document.createDocumentFragment();
  for(let i = 1; i <= pdfPageCount; i++){
    const pageEl = document.createElement("div");
    pageEl.className = "pdf-page pending";
    pageEl.dataset.pageNum = String(i);
    pageEl.appendChild(document.createElement("canvas"));
    frag.appendChild(pageEl);
  }
  pdfScrollerEl.appendChild(frag);

  pdfObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const pageEl = entry.target;
      const num = parseInt(pageEl.dataset.pageNum, 10);
      if(entry.isIntersecting){
        renderPdfPageInto(pageEl, num, loadId);
        if(entry.intersectionRatio > 0.5){
          pdfCurrentPage = num;
          updateLightboxNav();
        }
      }
    });
  }, { root: pdfScrollerEl, threshold: [0, 0.5, 1] });

  pdfScrollerEl.querySelectorAll(".pdf-page").forEach(el => pdfObserver.observe(el));
}

async function renderPdfPageInto(pageEl, num, loadId){
  if(loadId !== pdfLoadId || !pdfDoc) return;
  if(pageEl.dataset.rendered === "1" || pageEl.dataset.rendering === "1") return;
  pageEl.dataset.rendering = "1";
  try{
    const page = await pdfDoc.getPage(num);
    if(loadId !== pdfLoadId) return;
    const unscaled = page.getViewport({ scale: 1 });
    const maxW = Math.min(window.innerWidth * 0.92, 1200);
    const maxH = window.innerHeight * 0.86;
    const fitScale = Math.min(maxW / unscaled.width, maxH / unscaled.height);
    // 建築線稿常有很多密集的細線，用一般螢幕解析度渲染會讓線條糊成一片。
    // 這裡刻意把「畫布實際像素」拉高到遠超過螢幕顯示尺寸（至少 2 倍，
    // Retina 螢幕再加倍），瀏覽器縮小顯示時線條才會維持銳利、不會擠在一起。
    const outputScale = Math.max(window.devicePixelRatio || 1, 1) * 2;
    const viewport = page.getViewport({ scale: fitScale });

    const canvas = pageEl.querySelector("canvas");
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";
    const ctx = canvas.getContext("2d");
    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : undefined;

    await page.render({ canvasContext: ctx, viewport, transform }).promise;
    if(loadId !== pdfLoadId) return;
    pageEl.dataset.rendered = "1";
    pageEl.classList.remove("pending");
  }catch(err){
    console.warn("PDF 頁面渲染失敗：", err);
  }finally{
    pageEl.dataset.rendering = "0";
  }
}

function scrollToPdfPage(num){
  const pageEl = pdfScrollerEl.querySelector(`.pdf-page[data-page-num="${num}"]`);
  if(pageEl) pageEl.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
}

/* 滑桿拖曳跳頁：直接跳過去，不做平滑捲動動畫，
   避免拖到很遠的頁面時要把中間每一頁都滑過一遍、速度變慢 */
function jumpToPdfPageInstant(num){
  pdfCurrentPage = num;
  lightboxCounterEl.textContent = pdfPageCount ? `${pdfCurrentPage} / ${pdfPageCount}` : "";
  const pageEl = pdfScrollerEl.querySelector(`.pdf-page[data-page-num="${num}"]`);
  if(pageEl) pageEl.scrollIntoView({ behavior:"auto", inline:"center", block:"nearest" });
}

function lightboxPrev(){
  const item = lightboxImages[lightboxIndex];
  if(item.type === "pdf" && pdfPageCount > 1){
    const prevPage = pdfCurrentPage > 1 ? pdfCurrentPage - 1 : pdfPageCount;
    scrollToPdfPage(prevPage);
    return;
  }
  lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
}

function lightboxNext(){
  const item = lightboxImages[lightboxIndex];
  if(item.type === "pdf" && pdfPageCount > 1){
    const nextPage = pdfCurrentPage < pdfPageCount ? pdfCurrentPage + 1 : 1;
    scrollToPdfPage(nextPage);
    return;
  }
  lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
  updateLightbox();
}

/* 桌機滑鼠拖曳翻頁（觸控裝置本來就能直接用手指滑動） */
(function enablePdfDragScroll(){
  let isDown = false, startX = 0, startScroll = 0;

  pdfScrollerEl.addEventListener("pointerdown", (e) => {
    if(e.pointerType === "touch") return;
    isDown = true;
    pdfScrollerEl.classList.add("dragging");
    startX = e.clientX;
    startScroll = pdfScrollerEl.scrollLeft;
    pdfScrollerEl.setPointerCapture(e.pointerId);
  });
  pdfScrollerEl.addEventListener("pointermove", (e) => {
    if(!isDown) return;
    pdfScrollerEl.scrollLeft = startScroll - (e.clientX - startX);
  });
  function endDrag(){
    if(!isDown) return;
    isDown = false;
    pdfScrollerEl.classList.remove("dragging");
    const w = pdfScrollerEl.clientWidth || 1;
    const idx = Math.round(pdfScrollerEl.scrollLeft / w) + 1;
    scrollToPdfPage(Math.min(Math.max(idx, 1), pdfPageCount));
  }
  pdfScrollerEl.addEventListener("pointerup", endDrag);
  pdfScrollerEl.addEventListener("pointercancel", endDrag);
  pdfScrollerEl.addEventListener("pointerleave", endDrag);
})();

lightboxEl.addEventListener("click", (e) => {
  if(e.target === lightboxEl) closeLightbox();
});
document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
lightboxPrevBtn.addEventListener("click", lightboxPrev);
lightboxNextBtn.addEventListener("click", lightboxNext);

function applyLbTransform(){
  lightboxImgEl.style.transform = `translate(${lbPanX}px, ${lbPanY}px) scale(${lbScale})`;
  lightboxZoomHintEl.style.opacity = lbZoomed ? "0" : "";
}

// 依圖片原始像素與目前顯示尺寸的比例，算出「幾乎等於原始解析度」的放大倍率（上限 5 倍，避免過度放大變糊）
function lbMaxScale(){
  const rect = lightboxImgEl.getBoundingClientRect();
  const baseWidth = rect.width / (lbScale || 1);
  const natural = lightboxImgEl.naturalWidth || baseWidth;
  return Math.min(Math.max(natural / baseWidth, 1.4), 5);
}

// 點擊圖片：在「縮小塞進視窗」與「接近原始像素」之間切換，並以點擊位置為中心放大
lightboxImgEl.addEventListener("click", (e) => {
  e.stopPropagation();
  if(lbDragging) return;
  const rect = lightboxImgEl.getBoundingClientRect();
  if(!lbZoomed){
    const targetScale = lbMaxScale();
    const offsetX = e.clientX - (rect.left + rect.width / 2);
    const offsetY = e.clientY - (rect.top + rect.height / 2);
    lbScale = targetScale;
    lbPanX = -offsetX * (targetScale - 1);
    lbPanY = -offsetY * (targetScale - 1);
    lbZoomed = true;
    lightboxImgEl.classList.add("zoomed");
  } else {
    resetLbZoom();
  }
  applyLbTransform();
});

// 滾輪縮放：以游標位置為中心放大/縮小，方便直接對著想看清楚的細節捲動滑鼠滾輪
lightboxImgEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = lightboxImgEl.getBoundingClientRect();
  const cursorOffsetX = e.clientX - (rect.left + rect.width / 2);
  const cursorOffsetY = e.clientY - (rect.top + rect.height / 2);
  const prevScale = lbScale || 1;
  const maxScale = lbMaxScale();
  let newScale = prevScale - e.deltaY * 0.0025;
  newScale = Math.min(Math.max(newScale, 1), maxScale);
  if(newScale === prevScale) return;
  const ratio = newScale / prevScale;
  lbPanX = (lbPanX - cursorOffsetX) * ratio + cursorOffsetX;
  lbPanY = (lbPanY - cursorOffsetY) * ratio + cursorOffsetY;
  lbScale = newScale;
  lbZoomed = newScale > 1.01;
  lightboxImgEl.classList.toggle("zoomed", lbZoomed);
  if(!lbZoomed){ lbPanX = 0; lbPanY = 0; }
  applyLbTransform();
}, { passive:false });

// 放大後可拖曳平移，查看畫面各個角落的細節
lightboxImgEl.addEventListener("pointerdown", (e) => {
  if(!lbZoomed) return;
  lbDragging = true;
  lightboxImgEl.classList.add("lb-dragging");
  lbDragStartX = e.clientX; lbDragStartY = e.clientY;
  lbPanStartX = lbPanX; lbPanStartY = lbPanY;
  lightboxImgEl.setPointerCapture(e.pointerId);
});
lightboxImgEl.addEventListener("pointermove", (e) => {
  if(!lbDragging) return;
  lbPanX = lbPanStartX + (e.clientX - lbDragStartX);
  lbPanY = lbPanStartY + (e.clientY - lbDragStartY);
  applyLbTransform();
});
function endLbDrag(){
  lbDragging = false;
  lightboxImgEl.classList.remove("lb-dragging");
}
lightboxImgEl.addEventListener("pointerup", endLbDrag);
lightboxImgEl.addEventListener("pointercancel", endLbDrag);
lightboxImgEl.addEventListener("pointerleave", endLbDrag);

pdfPageRangeEl.addEventListener("input", () => {
  isDraggingPdfSlider = true;
  jumpToPdfPageInstant(parseInt(pdfPageRangeEl.value, 10));
});
pdfPageRangeEl.addEventListener("change", () => {
  isDraggingPdfSlider = false;
});

document.addEventListener("keydown", (e) => {
  if(!lightboxEl.classList.contains("active")) return;
  if(document.activeElement === pdfPageRangeEl) return; // 讓滑桿聚焦時，方向鍵只調整滑桿本身
  if(e.key === "Escape"){ closeLightbox(); }
  if(e.key === "ArrowLeft") lightboxPrev();
  if(e.key === "ArrowRight") lightboxNext();
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
