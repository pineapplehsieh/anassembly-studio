[build]
  functions = "netlify/functions"
  publish = "."
  # 這個網站本身是 GitHub Pages 在提供的，Netlify 在這裡只負責執行 netlify/functions 底下
  # 那幾支登入／統計用的小函式。後台每新增一筆作品、每上傳一張照片，都會變成一次
  # git push，如果每次都讓 Netlify 重新部署，會白白燒掉 Netlify 的免費額度。
  # 所以這裡設定：只有 netlify.toml 或 netlify/ 資料夾有異動時才真的部署，
  # 其他內容異動（content/、uploads/、index.html、admin/ 等）一律跳過。
  #
  # 指令結束代碼 0 = 沒有異動 → 略過這次部署；非 0 = 有異動或無法判斷 → 照常部署。
  # 官方文件給的範例（不含防呆）在拿不到比較基準（$CACHED_COMMIT_REF 是空字串）時，
  # 會被 shell 直接丟掉那個空參數，退化成「跟自己比對」，永遠回報沒有差異、
  # 誤判成略過——這裡先判斷有沒有拿到基準，拿不到就直接照常部署，不要冒然略過。
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- netlify.toml netlify/'
